<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Reitzin Family Hub — a hearth for schedules, shifts and small magics."
		/>
		<meta name="theme-color" content="#150e1e" />

		<!--
			Resolve the theme before first paint so the page never flashes the
			wrong one. Mirrors the logic in src/lib/theme.js.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('familyhub-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark';
					document.documentElement.setAttribute('data-theme', theme);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'light' ? '#f2e8d2' : '#150e1e');
				} catch (e) {
					/* private mode / no storage — the dark default stands */
				}
			})();
		</script>

		<!--
			Fonts are self-hosted from static/fonts (see src/fonts.css) — no
			third-party request at runtime. Preload the three that appear above
			the fold on every page.
		-->
		<link
			rel="preload"
			href="/fonts/alegreya-sans-400-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/cinzel-600-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/pixelify-sans-500-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
