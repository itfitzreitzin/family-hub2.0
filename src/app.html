<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Family Hub — a hearth for schedules, shifts and small magics." />
		<meta name="theme-color" content="#150e1e" />

		<!--
			The cottage icon, cut from one painting into static/: favicon.ico
			(16/32/48) for tabs, a 180px opaque square for iOS's home screen
			(iOS rounds its own corners), and the manifest's 192/512 plus a
			full-bleed maskable 512 for Android. Here rather than in the layout
			so pages with ssr = false still carry them in their first HTML.
			No page sets a <title>, so iOS would name the home-screen icon after
			the address; apple-mobile-web-app-title names it instead.
		-->
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Family Hub" />

		<!--
			Resolve the theme before first paint so the page never flashes the
			wrong one. Mirrors the logic in src/lib/theme.js.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('familyhub-theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark';
					document.documentElement.setAttribute('data-theme', theme);
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'light' ? '#f2e8d2' : '#150e1e');
				} catch (e) {
					/* private mode / no storage — the dark default stands */
				}
			})();
		</script>

		<!--
			Fonts are self-hosted from static/fonts (see src/fonts.css) — no
			third-party request at runtime. Preload the two that appear above
			the fold on every page.
		-->
		<link
			rel="preload"
			href="/fonts/alegreya-sans-400-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/cinzel-600-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
